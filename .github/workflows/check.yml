name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_scoring.py
      - run: python scripts/check_workbook.py
      - run: python scripts/check_ecommerce.py
      - run: python scripts/check_baking.py
      - run: python scripts/check_research_project.py
      - run: python scripts/check_analysis.py
